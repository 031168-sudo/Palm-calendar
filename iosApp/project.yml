name: DateBook
options:
  bundleIdPrefix: ru.palmdate
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  DateBook:
    type: application
    platform: iOS
    sources: [DateBook]
    info:
      path: DateBook/Info.plist
      properties:
        CFBundleDisplayName: DateBook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationQueriesSchemes: [message, googlegmail, ms-outlook, yandexmail, whatsapp, tg, viber]
        UILaunchScreen: {}
        NSCalendarsUsageDescription: "DateBook показывает и создаёт события в вашем календаре."
        NSCalendarsFullAccessUsageDescription: "DateBook показывает и создаёт события в вашем календаре."
        NSContactsUsageDescription: "DateBook связывает события с людьми из ваших контактов."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.palmdate.app
        PRODUCT_NAME: DateBook
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/bin/$(KMP_TARGET)/debugFramework"
        OTHER_LDFLAGS: "-framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
