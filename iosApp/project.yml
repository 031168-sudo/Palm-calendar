name: DateBook
options:
  bundleIdPrefix: ru.palmdate
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  DateBook:
    type: application
    platform: iOS
    sources: [DateBook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.palmdate.app
        PRODUCT_NAME: DateBook
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: DateBook
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/bin/$(KMP_TARGET)/debugFramework"
        OTHER_LDFLAGS: "-framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
