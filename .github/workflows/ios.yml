name: iOS check

# Проверка, что общий код (shared) собирается под iOS. Идёт на macOS-раннере GitHub.
on:
  push:
    branches: [ kmp ]
  workflow_dispatch:

jobs:
  ios-shared:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile shared for iOS simulator
        run: |
          set -o pipefail
          gradle :shared:compileKotlinIosSimulatorArm64 2>&1 | tee ios.log || {
            ERR=$(grep -E "^e: " ios.log | sed -e 's#file:///Users/runner/work/[^/]*/[^/]*/##' -e 's/%/%25/g' | head -150 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки Kotlin iOS::$ERR"
            grep -E "What went wrong|error:|Exception" -A3 ios.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }
