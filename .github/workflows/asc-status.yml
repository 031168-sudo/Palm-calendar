name: ASC status

# Проверяет у Apple, что стало с отправленными сборками (изменить .github/asc-status-trigger.txt в ветке kmp).
on:
  workflow_dispatch:
  push:
    branches: [ kmp ]
    paths: [ '.github/asc-status-trigger.txt' ]

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, json, jwt, requests
          kid = os.environ["KID"].strip(); iss = os.environ["ISS"].strip()
          body = "".join(os.environ["K"].replace("-----BEGIN PRIVATE KEY-----", "").replace("-----END PRIVATE KEY-----", "").split())
          key = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          h = {"Authorization": "Bearer " + tok}
          out = []
          B = "https://api.appstoreconnect.apple.com"
          app = requests.get(B + "/v1/apps?filter[bundleId]=ru.palmdate.app", headers=h).json()["data"][0]["id"]
          def get(path):
              r = requests.get(B + path, headers=h)
              try: return r.status_code, r.json()
              except Exception: return r.status_code, {"raw": r.text[:300]}
          c, j = get(f"/v1/builds?filter[app]={app}&limit=10&include=buildBetaDetail")
          out.append(f"builds {c}")
          for d in j.get("data", []):
              a = d["attributes"]
              out.append("build " + json.dumps({k: a.get(k) for k in ("version", "processingState", "expired", "usesNonExemptEncryption", "uploadedDate")}, ensure_ascii=False) + " id=" + d["id"])
          for d in j.get("included", []):
              out.append("beta " + json.dumps(d["attributes"], ensure_ascii=False))
          c, j = get(f"/v1/apps/{app}/betaGroups?include=builds,betaTesters")
          out.append(f"groups {c}")
          for d in j.get("data", []):
              out.append("group " + json.dumps({k: d["attributes"].get(k) for k in ("name", "isInternalGroup", "hasAccessToAllBuilds", "publicLinkEnabled")}, ensure_ascii=False) + " builds=" + str(len(d.get("relationships", {}).get("builds", {}).get("data", []) or [])) + " testers=" + str(len(d.get("relationships", {}).get("betaTesters", {}).get("data", []) or [])))
          c, j = get(f"/v1/betaTesters?filter[apps]={app}")
          out.append(f"testers {c}")
          for d in j.get("data", []):
              a = d["attributes"]
              out.append("tester " + json.dumps({k: a.get(k) for k in ("state", "inviteType")}, ensure_ascii=False) + " " + str(a.get("email", ""))[:4] + "***")
          print("::warning title=Ошибки статус Apple::" + " | ".join(out).replace("\n", " "))
          PY
