name: ASC status

# Проверяет у Apple, что стало с отправленными сборками (изменить .github/asc-status-trigger.txt в ветке kmp).
on:
  workflow_dispatch:
  push:
    branches: [ kmp ]
    paths: [ '.github/asc-status-trigger.txt' ]

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          pip3 install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, json, jwt, requests
          kid = os.environ["KID"].strip(); iss = os.environ["ISS"].strip()
          body = "".join(os.environ["K"].replace("-----BEGIN PRIVATE KEY-----", "").replace("-----END PRIVATE KEY-----", "").split())
          key = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          h = {"Authorization": "Bearer " + tok}
          out = []
          B = "https://api.appstoreconnect.apple.com"
          app = requests.get(B + "/v1/apps?filter[bundleId]=ru.palmdate.app", headers=h).json()["data"][0]["id"]
          def get(path):
              r = requests.get(B + path, headers=h)
              try: return r.status_code, r.json()
              except Exception: return r.status_code, {"raw": r.text[:300]}
          c, j = get(f"/v1/apps/{app}/betaFeedbackCrashSubmissions?limit=5&sort=-createdDate")
          out.append(f"crashes {c} n={len(j.get('data', []))} {str(j)[:200] if c != 200 else ''}")
          for d in j.get("data", [])[:2]:
              cc, lj = get(f"/v1/betaFeedbackCrashSubmissions/{d['id']}/crashLog")
              out.append(f"crashlog {cc} created={d['attributes'].get('createdDate')}")
              txt = (lj.get("data", {}).get("attributes", {}) or {}).get("logText", "") or str(lj)[:300]
              keep = [l for l in txt.splitlines() if any(k in l for k in ("Exception Type", "Exception Codes", "Termination", "Application Specific", "NSInvalid", "*** ", "Crashed", "ru.palmdate", "Shared", "palmdate", "libobjc", "Contacts", "EventKit", "kotlin::", "Kotlin"))]
              out.append(" // ".join(l.strip()[:170] for l in keep[:45]))
          c, j = get(f"/v1/builds?filter[app]={app}&limit=20&sort=-uploadedDate&include=buildBetaDetail")
          det = {x["id"]: x["attributes"] for x in j.get("included", []) if x["type"] == "buildBetaDetails"}
          for bld in j.get("data", []):
              a = bld["attributes"]
              bd = bld.get("relationships", {}).get("buildBetaDetail", {}).get("data") or {}
              d = det.get(bd.get("id"), {})
              out.append(f"BUILD v{a.get('version')} proc={a.get('processingState')} ext={d.get('externalBuildState')} int={d.get('internalBuildState')}")
          c, j = get(f"/v1/apps/{app}/betaGroups?limit=50")
          for g in j.get("data", []):
              a = g["attributes"]
              out.append(f"GROUP name={a.get('name')} internal={a.get('isInternalGroup')}")
              cc, tj = get(f"/v1/betaGroups/{g['id']}/betaTesters?limit=50")
              for t in tj.get("data", []):
                  ta = t["attributes"]
                  out.append(f"  TESTER {ta.get('email')} state={ta.get('state')}")
              cc, bj = get(f"/v1/betaGroups/{g['id']}/builds?limit=20")
              out.append("  BUILDS " + ",".join(str(x['attributes'].get('version')) for x in bj.get("data", [])))
          print("::warning title=Ошибки статус Apple::" + " | ".join(out).replace("\n", " "))
          PY
