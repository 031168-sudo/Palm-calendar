name: iOS TestFlight

# Собирает подписанное приложение для iPhone и отправляет в TestFlight. Запуск — вручную (Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Pick Xcode
        run: |
          [ -d /Applications/Xcode_16.0.app ] && sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Check secrets
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          T: ${{ secrets.ASC_TEAM_ID }}
        run: |
          [ -n "$K" ] || { echo "::error::Нет секрета ASC_KEY_P8"; exit 1; }
          [ -n "$I" ] || { echo "::error::Нет секрета ASC_ISSUER_ID"; exit 1; }
          [ -n "$T" ] || { echo "::error::Нет секрета ASC_TEAM_ID (Team ID из developer.apple.com → Membership)"; exit 1; }

      - name: Build Kotlin framework (release, iPhone)
        run: |
          set -o pipefail
          gradle :shared:linkReleaseFrameworkIosArm64 2>&1 | tee fw.log || {
            ERR=$(grep -E "^e: " fw.log | sed -e 's#file:///Users/runner/work/[^/]*/[^/]*/##' -e 's/%/%25/g' | head -100 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки Kotlin iOS::$ERR"
            exit 1
          }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Write API key
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$K" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project DateBook.xcodeproj -scheme DateBook -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DateBook.xcarchive \
            KMP_TARGET=iosArm64 \
            FRAMEWORK_SEARCH_PATHS='$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework' \
            DEVELOPMENT_TEAM=${{ secrets.ASC_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive 2>&1 | tee ../xc.log || {
            ERR=$(grep -E "error:" ../xc.log | sed -e 's/%/%25/g' | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки Xcode::$ERR"
            exit 1
          }

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          cd iosApp
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.ASC_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/DateBook.xcarchive \
            -exportOptionsPlist build/export.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} 2>&1 | tee ../exp.log || {
            ERR=$(grep -iE "error|fail" ../exp.log | sed -e 's/%/%25/g' | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки выгрузки::$ERR"
            exit 1
          }
