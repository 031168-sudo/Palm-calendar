name: iOS TestFlight

# Собирает подписанное приложение для iPhone и отправляет в TestFlight. Запуск — вручную (Run workflow).
on:
  workflow_dispatch:
  # запуск: изменить файл .github/testflight-trigger.txt в ветке kmp
  push:
    branches: [ kmp ]
    paths: [ '.github/testflight-trigger.txt' ]

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Pick Xcode
        run: |
          ls /Applications | grep -i xcode || true
          LATEST=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST" || true
          xcrun simctl list runtimes | head
          xcodebuild -version

      - name: Normalize ids
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          echo "KEY_ID=$(printf '%s' "$KID" | tr -d ' \r\n\t')" >> $GITHUB_ENV
          echo "ISSUER_ID=$(printf '%s' "$ISS" | tr -d ' \r\n\t')" >> $GITHUB_ENV
          echo "TEAM_ID=$(printf '%s' "$TID" | tr -d ' \r\n\t')" >> $GITHUB_ENV
          echo "::warning title=Ошибки длины секретов::длины: KeyID=$(printf '%s' "$KID" | tr -d ' \r\n\t' | wc -c) (нужно 10), Issuer=$(printf '%s' "$ISS" | tr -d ' \r\n\t' | wc -c) (нужно 36), Team=$(printf '%s' "$TID" | tr -d ' \r\n\t' | wc -c) (нужно 10)"

      - name: Check secrets
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          T: ${{ secrets.ASC_TEAM_ID }}
        run: |
          [ -n "$K" ] || { echo "::error::Нет секрета ASC_KEY_P8"; exit 1; }
          [ -n "$I" ] || { echo "::error::Нет секрета ASC_ISSUER_ID"; exit 1; }
          [ -n "$T" ] || { echo "::error::Нет секрета ASC_TEAM_ID (Team ID из developer.apple.com → Membership)"; exit 1; }

      - name: Build Kotlin framework (release, iPhone)
        run: |
          set -o pipefail
          gradle :shared:linkReleaseFrameworkIosArm64 2>&1 | tee fw.log || {
            ERR=$(grep -E "^e: " fw.log | sed -e 's#file:///Users/runner/work/[^/]*/[^/]*/##' -e 's/%/%25/g' | head -100 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки Kotlin iOS::$ERR"
            exit 1
          }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Write API key
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          # Приводим ключ к правильному виду, даже если при вставке пропали переводы строк
          BODY=$(printf '%s' "$K" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > ~/private_keys/AuthKey_$KEY_ID.p8
          echo "длина ключа: ${#BODY}"

      - name: Test API key
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 - <<'PY' || true
          import os, time, jwt, urllib.request, urllib.error
          kid = os.environ["KEY_ID"]; iss = os.environ["ISSUER_ID"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=ru.palmdate.app", headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req); body = r.read().decode()[:300]; msg = f"HTTP {r.status} {body}"
          except urllib.error.HTTPError as e:
              msg = f"HTTP {e.code} {e.read().decode()[:300]}"
          except Exception as e:
              msg = f"ошибка: {e}"
          print(f"::warning title=Ошибки проверка ключа::KeyID={kid} Issuer={iss[:8]}... {msg}".replace("\n", " "))
          PY

      - name: Archive
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project DateBook.xcodeproj -scheme DateBook -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/DateBook.xcarchive \
            KMP_TARGET=iosArm64 \
            FRAMEWORK_SEARCH_PATHS='$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework' \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID $KEY_ID \
            -authenticationKeyIssuerID $ISSUER_ID \
            archive 2>&1 | tee ../xc.log || {
            ERR=$(grep -E "error:" ../xc.log | sed -e 's/%/%25/g' | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки Xcode::$ERR"
            exit 1
          }

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          cd iosApp
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/DateBook.xcarchive \
            -exportOptionsPlist build/export.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID $KEY_ID \
            -authenticationKeyIssuerID $ISSUER_ID 2>&1 | tee ../exp.log || {
            ERR=$(tail -40 ../exp.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки выгрузки::$ERR"
            exit 1
          }

      - name: Upload to TestFlight (App Store Connect API)
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography requests 2>/dev/null || pip3 install --quiet pyjwt cryptography requests
          IPA=$(find iosApp/build/export -name "*.ipa" | head -1)
          echo "ipa: $IPA"
          IPA="$IPA" python3 - <<'PY'
          import os, time, json, jwt, requests, sys
          kid = os.environ["KEY_ID"]; iss = os.environ["ISSUER_ID"]; ipa = os.environ["IPA"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          def token():
              return jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 1100, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          base = "https://api.appstoreconnect.apple.com"
          def api(method, path, body=None):
              r = requests.request(method, base + path, headers={"Authorization": "Bearer " + token(), "Content-Type": "application/json"}, data=json.dumps(body) if body is not None else None)
              if r.status_code >= 300:
                  print(f"::error title=Ошибки загрузки API::{method} {path} -> {r.status_code} {r.text[:500]}".replace("\n", " "))
                  sys.exit(1)
              return r.json() if r.text else {}
          app = api("GET", "/v1/apps?filter[bundleId]=ru.palmdate.app")["data"][0]["id"]
          ver = "0.1"; build = os.environ["GITHUB_RUN_NUMBER"]
          bu = api("POST", "/v1/buildUploads", {"data": {"type": "buildUploads", "attributes": {"cfBundleShortVersionString": ver, "cfBundleVersion": build, "platform": "IOS"}, "relationships": {"app": {"data": {"type": "apps", "id": app}}}}})["data"]["id"]
          size = os.path.getsize(ipa)
          f = api("POST", "/v1/buildUploadFiles", {"data": {"type": "buildUploadFiles", "attributes": {"fileName": os.path.basename(ipa), "fileSize": size, "uti": "com.apple.ipa", "assetType": "ASSET"}, "relationships": {"buildUpload": {"data": {"type": "buildUploads", "id": bu}}}}})["data"]
          data = open(ipa, "rb").read()
          for op in f["attributes"]["uploadOperations"]:
              chunk = data[op["offset"]: op["offset"] + op["length"]]
              h = {x["name"]: x["value"] for x in op["requestHeaders"]}
              r = requests.request(op["method"], op["url"], headers=h, data=chunk)
              if r.status_code >= 300:
                  print(f"::error title=Ошибки загрузки файла::{r.status_code} {r.text[:300]}".replace("\n", " ")); sys.exit(1)
          api("PATCH", "/v1/buildUploadFiles/" + f["id"], {"data": {"type": "buildUploadFiles", "id": f["id"], "attributes": {"uploaded": True}}})
          print(f"::warning title=Ошибки итог загрузки::Файл {size} байт отправлен, сборка {ver} ({build}); ждём обработки в TestFlight")
          PY
