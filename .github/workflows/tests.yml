name: Tests and screenshots

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Тесты логики + скриншоты экранов (телефон, раскладушка, планшет; светлая и тёмная тема)
      - name: Run tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest 2>&1 | tee test.log || {
            grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:" -A2 test.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: app/screenshots
          if-no-files-found: warn

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests
