name: Tests and screenshots

on:
  push:
    branches: [ main, kmp ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Тесты логики + скриншоты экранов (телефон, раскладушка, планшет; светлая и тёмная тема)
      - name: Run tests
        run: |
          set -o pipefail
          gradle :shared:testDebugUnitTest :app:testDebugUnitTest 2>&1 | tee test.log || {
            ERR=$(grep -E "^e: " test.log | sed -e 's#file:///home/runner/work/[^/]*/[^/]*/##' -e 's/%/%25/g' | head -150 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$ERR" ] && echo "::error title=Ошибки Kotlin::$ERR"
            grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:|but was|Expected" -A3 test.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      # Сколько тестов реально выполнилось (видно в аннотациях запуска)
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          for mod in ("shared", "app"):
              t = s = f = 0
              for p in glob.glob(f"{mod}/build/test-results/testDebugUnitTest/*.xml"):
                  m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(p, encoding="utf-8").read(3000))
                  if m:
                      t += int(m[1]); s += int(m[2]); f += int(m[3]) + int(m[4])
              print(f"::notice title=Tests {mod}::run {t}, skipped {s}, failed {f}")
              # Причины падений: имя теста и начало сообщения (первые 12 штук, разные причины)
              seen = set(); out = []
              for p in sorted(glob.glob(f"{mod}/build/test-results/testDebugUnitTest/*.xml")):
                  txt = open(p, encoding="utf-8").read()
                  for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]{0,400})', txt):
                      key = m[3][:120]
                      if key in seen: continue
                      seen.add(key); out.append(f"{m[2].split('.')[-1]}.{m[1]}: {m[3]}")
              if out:
                  msg = "%0A".join(x.replace("%", "%25").replace("\n", " ").replace("&#10;", " ")[:500] for x in out[:12])
                  print(f"::error title=Failures {mod}::{msg}")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: app/screenshots
          if-no-files-found: warn

      # Скриншоты — ещё и в ветку screenshots: их видно прямо на GitHub, без скачивания
      - name: Publish screenshots branch
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          [ -d app/screenshots ] || exit 0
          cd app/screenshots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          {
            echo "# Скриншоты DateBook — сборка ${{ github.run_number }}"
            for d in */; do
              echo; echo "## ${d%/}"
              for f in "$d"*.png; do echo "<img src=\"$f\" width=\"260\">"; done
            done
          } > README.md
          git add -A
          git commit -qm "Скриншоты сборки ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests
