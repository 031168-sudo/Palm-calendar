name: Tests and screenshots

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Тесты логики + скриншоты экранов (телефон, раскладушка, планшет; светлая и тёмная тема)
      - name: Run tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest 2>&1 | tee test.log || {
            grep -E "^e: |error:|What went wrong|FAILED|Exception|expected:" -A2 test.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: app/screenshots
          if-no-files-found: warn

      # Скриншоты — ещё и в ветку screenshots: их видно прямо на GitHub, без скачивания
      - name: Publish screenshots branch
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          [ -d app/screenshots ] || exit 0
          cd app/screenshots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          {
            echo "# Скриншоты DateBook — сборка ${{ github.run_number }}"
            for d in */; do
              echo; echo "## ${d%/}"
              for f in "$d"*.png; do echo "<img src=\"$f\" width=\"260\">"; done
            done
          } > README.md
          git add -A
          git commit -qm "Скриншоты сборки ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests
