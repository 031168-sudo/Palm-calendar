name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee build.log || {
            # Ошибки компиляции — в аннотации, чтобы их было видно без скачивания логов
            grep -E "^e: |error:|What went wrong" -A1 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }
          cp app/build/outputs/apk/debug/app-debug.apk DateBook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DateBook-debug-${{ github.run_number }}
          path: DateBook.apk

      # Релиз с APK: прямая ссылка на файл, без zip.
      # Постоянная ссылка на последнюю версию:
      # https://github.com/<owner>/<repo>/releases/latest/download/DateBook.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" DateBook.apk \
            --title "DateBook 0.1.${{ github.run_number }}" \
            --notes "$MSG" \
            --target "${{ github.sha }}" \
            --latest
