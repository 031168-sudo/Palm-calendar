name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee build.log || {
            # Ошибки компиляции — в аннотации, чтобы их было видно без скачивания логов
            grep -E "^e: |error:|What went wrong" -A1 build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PalmDate-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
