name: Emulator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: tablet
            profile: pixel_tablet
          - device: fold
            profile: pixel_fold
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      # Эмулятору нужен аппаратный ускоритель
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Какие устройства знает эмулятор — в аннотацию (для отладки профилей)
      - name: List device profiles
        run: |
          AVD=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/avdmanager
          echo "::notice::$($AVD list device -c | tr '\n' ' ')"

      - name: Run on ${{ matrix.device }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/emulator/run.sh ${{ matrix.device }}

      # Скриншоты — в ветку emulator-<устройство>, их видно прямо на GitHub
      - name: Publish screenshots
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d emu-shots/${{ matrix.device }} ] || exit 0
          cd emu-shots/${{ matrix.device }}
          git init -q -b emulator-${{ matrix.device }}
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          {
            echo "# Эмулятор ${{ matrix.profile }} — запуск ${{ github.run_number }}"
            for f in *.png; do echo "<img src=\"$f\" width=\"300\" title=\"$f\">"; done
          } > README.md
          git add -A
          git commit -qm "Эмулятор ${{ matrix.device }}, запуск ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-${{ matrix.device }}
